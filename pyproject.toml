[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-graph-engine"
version = "0.3.0"
description = "Движок «Графа идеи»: проект, цепочка шагов, запуск агентов (Claude Code, OpenCode), UML-данные диаграмм"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["idea-graph-core @ git+https://github.com/senia-glitch/idea-graph-core.git"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
